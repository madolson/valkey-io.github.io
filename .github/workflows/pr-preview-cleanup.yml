# Deletes previews of closed pull requests, previews older than TTL_DAYS, and fork previews of
# anything but the current head, and keeps each pull request's preview comment current. Runs
# when a pull request closes, daily, and at the end of every pr-preview-deploy.yml run. Never
# checks out or runs a pull request. S3 also expires preview objects on its own (see
# infra/pr-previews.yml), in case this stops running. See docs/pr-previews.md.

name: PR preview cleanup

on:
  pull_request_target:
    branches: ["main"]
    types: [closed]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      pr:
        description: The pull request pr-preview-deploy.yml handled.
        type: string
        required: true
      sha:
        description: Its head commit.
        type: string
        required: true
      state:
        description: published, failed, unapproved, or unbuilt (which deletes the old preview).
        type: string
        required: true
    # A called workflow gets environment secrets only if the caller passes them by name.
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions: {}

jobs:
  cleanup:
    if: vars.PREVIEWS_DOMAIN != ''
    runs-on: ubuntu-latest
    environment: pr-previews
    permissions:
      id-token: write # assume the AWS role
      pull-requests: write # list open pull requests and update the preview comments
    env:
      # Previews are on when the environment has the role; steps can't read secrets in if.
      HAS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - if: env.HAS_ROLE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Long enough to review a pull request, short enough that an abandoned one's preview
          # doesn't linger. A new commit or the `preview` label publishes a fresh one. S3's own
          # expiry (ExpireDays in infra/pr-previews.yml) is one day longer.
          TTL_DAYS: 7
          BUCKET: ${{ vars.PREVIEWS_BUCKET }}
          DOMAIN: ${{ vars.PREVIEWS_DOMAIN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          STATE: ${{ inputs.state }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { BUCKET, DOMAIN, SHA, STATE } = process.env;
            const ttl = Number(process.env.TTL_DAYS) * 24 * 3600 * 1000;
            const day = time => new Date(time).toISOString().slice(0, 10);
            async function aws(...args) {
              const { exitCode, stdout, stderr } = await exec.getExecOutput('aws', args, { silent: true, ignoreReturnCode: true });
              if (exitCode !== 0) throw Object.assign(new Error(`aws ${args.slice(0, 2).join(' ')}: ${stderr.trim()}`), { stderr });
              return stdout;
            }

            // Each preview's marker, which the deploy writes before the files: { commit, deployed }.
            const previews = new Map();
            const prefixes = JSON.parse(await aws('s3api', 'list-objects-v2', '--bucket', BUCKET, '--prefix', 'pr-',
              '--delimiter', '/', '--query', 'CommonPrefixes[].Prefix', '--output', 'json')) ?? [];
            for (const prefix of prefixes) {
              const match = /^pr-([1-9][0-9]*)\/$/.exec(prefix);
              if (!match) {
                core.warning(`Leaving ${prefix} alone: it isn't a pull request's.`);
                continue;
              }
              let marker = {};
              try {
                marker = JSON.parse(await aws('s3', 'cp', `s3://${BUCKET}/${prefix}_preview.json`, '-'));
              } catch (e) {
                // Only a missing or unreadable marker means unmarked; any other AWS error stops the run.
                if (e.stderr !== undefined && !/\(404\)|NoSuchKey|Not Found/.test(e.stderr)) throw e;
              }
              previews.set(Number(match[1]), marker);
            }

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const heads = new Map(prs.map(p => [p.number, p.head.sha])); // open pull request -> head
            const forks = new Set(prs.filter(p => p.head.repo?.full_name !== `${owner}/${repo}`).map(p => p.number));
            const closed = context.eventName === 'pull_request_target' ? context.payload.pull_request.number : 0;
            heads.delete(closed);
            // What pr-preview-deploy.yml decided, unless the pull request has closed or moved on since.
            const target = heads.get(Number(process.env.PR)) === SHA ? Number(process.env.PR) : 0;

            const waiting = sha => 'waiting for a maintainer. This pull request is from a fork, so a maintainer ' +
              `has to review commit ${sha}, including what runs or is fetched during the build ` +
              '(`.github/`, `build/`, templates, `config.toml`), then add the `preview` label once it has built.';
            const notes = new Map(); // pull request -> what its comment says
            const updateOnly = new Set(); // pull requests whose comment, if any, is updated but not created
            const failed = new Set();
            const errors = [];
            for (const [pr, marker] of previews) {
              const head = heads.get(pr);
              const deployed = Date.parse(marker.deployed ?? '');
              // A fork's preview shows only its head, which was approved to publish. A head that
              // didn't build takes the old preview down too.
              const headOnly = forks.has(pr) || (pr === target && STATE === 'unbuilt');
              const why = !head ? 'closed' : !(deployed > 0) ? 'unmarked' : Date.now() > deployed + ttl ? 'expired'
                : headOnly && marker.commit !== head ? 'not the head' : '';
              if (!why) continue;
              try {
                await aws('s3', 'rm', `s3://${BUCKET}/pr-${pr}/`, '--recursive', '--only-show-errors');
                core.info(`Deleted the preview of #${pr} (${why}).`);
              } catch (e) {
                failed.add(pr);
                errors.push(e.message);
                continue;
              }
              if (why === 'closed') notes.set(pr, 'removed, since the pull request closed.');
              else if (why === 'expired') notes.set(pr, `expired on ${day(deployed + ttl)}. Push a commit or add the \`preview\` label to publish it again.`);
              else if (why === 'not the head' && forks.has(pr)) notes.set(pr, waiting(head));
            }
            if (closed && !previews.has(closed)) {
              notes.set(closed, 'none, since the pull request closed.');
              updateOnly.add(closed);
            }

            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const outcome = {
              published: `https://pr-${target}.${DOMAIN}/\n\n` +
                `Commit ${SHA}. Expires ${day(Date.now() + ttl)}. New commits replace it; ` +
                'on a pull request from a fork, they need the `preview` label again.',
              failed: `couldn't publish commit ${SHA}. See ${run}.`,
              // Unless it was approved and published since.
              unapproved: previews.get(target)?.commit === SHA ? undefined : waiting(SHA),
              unbuilt: `none, since commit ${SHA} didn't build. See the pull request's checks.`,
            }[STATE];
            if (outcome && target && !failed.has(target)) notes.set(target, outcome);

            const marker = '<!-- pr-preview -->';
            for (const [pr, note] of notes) {
              try {
                const body = `${marker}\n**Preview:** ${note}`;
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
                const mine = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
                if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                else if (!updateOnly.has(pr)) await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              } catch (e) {
                errors.push(`Comment on #${pr}: ${e.message}`);
              }
            }
            if (errors.length) core.setFailed(errors.join('\n'));
