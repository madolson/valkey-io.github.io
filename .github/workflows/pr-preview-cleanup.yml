# Deletes previews of closed pull requests, previews older than TTL_DAYS, deployments a newer
# one replaced, and fork previews of anything but the current head, and keeps each pull
# request's preview comment current. Runs when a pull request closes, daily, and at the end of
# every pr-preview-deploy.yml run. Never checks out or runs a pull request. See
# docs/pr-previews.md.

name: PR preview cleanup

on:
  pull_request_target:
    branches: ["main"]
    types: [closed]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      pr:
        description: The pull request pr-preview-deploy.yml handled.
        type: string
        required: true
      sha:
        description: Its head commit.
        type: string
        required: true
      state:
        description: published, failed, unapproved, or unbuilt (which deletes the old preview).
        type: string
        required: true
    # A called workflow gets environment secrets only if the caller passes them by name.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions: {}

jobs:
  cleanup:
    if: vars.PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pr-previews
    permissions:
      pull-requests: write # list open pull requests and update the preview comments
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Long enough to review a pull request, short enough that an abandoned one's preview
          # doesn't linger. A new commit or the `preview` label publishes a fresh one.
          TTL_DAYS: 7
          CLOUDFLARE_API: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PREVIEWS_PROJECT }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          STATE: ${{ inputs.state }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { CLOUDFLARE_API, CLOUDFLARE_ACCOUNT_ID, PROJECT, SHA, STATE } = process.env;
            const ttl = Number(process.env.TTL_DAYS) * 24 * 3600 * 1000;
            const day = time => new Date(time).toISOString().slice(0, 10);
            const deployments = `${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments`;
            async function cloudflare(path, method = 'GET') {
              const res = await fetch(deployments + path, {
                method, headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              });
              if (method === 'DELETE' && res.status === 404) return; // already gone
              const body = await res.json().catch(() => ({}));
              if (!res.ok || !body.success) {
                throw new Error(`Cloudflare ${method} ${path}: HTTP ${res.status} ${JSON.stringify(body.errors ?? body)}`);
              }
              return body;
            }

            // Each pull request's preview deployments, newest first.
            const previews = new Map();
            const seen = new Set(); // a deploy during the listing shifts pages, repeating one
            const perPage = 25;
            for (let page = 1; ; page++) {
              const { result, result_info: info } = await cloudflare(`?env=preview&per_page=${perPage}&page=${page}`);
              for (const d of result) {
                if (seen.has(d.id)) continue;
                seen.add(d.id);
                const branch = d.deployment_trigger?.metadata?.branch ?? '';
                const match = /^pr-([1-9][0-9]*)$/.exec(branch);
                if (!match) {
                  core.warning(`Leaving deployment ${d.id} alone: its branch, "${branch}", isn't a pull request's.`);
                  continue;
                }
                const list = previews.get(Number(match[1])) ?? [];
                previews.set(Number(match[1]), [...list, d]);
              }
              if (info?.total_pages ? page >= info.total_pages : result.length < perPage) break;
            }
            for (const list of previews.values()) list.sort((a, b) => Date.parse(b.created_on) - Date.parse(a.created_on));
            const commit = d => d.deployment_trigger?.metadata?.commit_hash;

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const heads = new Map(prs.map(p => [p.number, p.head.sha])); // open pull request -> head
            const forks = new Set(prs.filter(p => p.head.repo?.full_name !== `${owner}/${repo}`).map(p => p.number));
            const closed = context.eventName === 'pull_request_target' ? context.payload.pull_request.number : 0;
            heads.delete(closed);
            // What pr-preview-deploy.yml decided, unless the pull request has closed or moved on since.
            const target = heads.get(Number(process.env.PR)) === SHA ? Number(process.env.PR) : 0;

            const waiting = sha => 'waiting for a maintainer. This pull request is from a fork, so a maintainer ' +
              `has to review commit ${sha}, including what runs or is fetched during the build ` +
              '(`.github/`, `build/`, templates, `config.toml`), then add the `preview` label once it has built.';
            const notes = new Map(); // pull request -> what its comment says
            const updateOnly = new Set(); // pull requests whose comment, if any, is updated but not created
            const failed = new Set();
            const errors = [];
            for (const [pr, list] of previews) {
              const head = heads.get(pr);
              const expired = Date.now() > Date.parse(list[0].created_on) + ttl;
              // A fork's preview shows only its head, which was approved to publish. A head that
              // didn't build takes the old preview down too.
              const headOnly = forks.has(pr) || (pr === target && STATE === 'unbuilt');
              const keep = !head || expired ? undefined : headOnly ? list.find(d => commit(d) === head) : list[0];
              try {
                for (const d of list.filter(d => d !== keep)) {
                  await cloudflare(`/${d.id}?force=true`, 'DELETE');
                  const why = !head ? 'closed' : expired ? 'expired' : commit(d) === head ? 'replaced' : 'not the head';
                  core.info(`Deleted deployment ${d.id} of #${pr} (${why}).`);
                }
              } catch (e) {
                failed.add(pr);
                errors.push(e.message);
                continue;
              }
              if (!head) notes.set(pr, 'removed, since the pull request closed.');
              else if (expired) notes.set(pr, `expired on ${day(Date.parse(list[0].created_on) + ttl)}. Push a commit or add the \`preview\` label to publish it again.`);
              else if (forks.has(pr) && !keep) notes.set(pr, waiting(head));
            }
            if (closed && !previews.has(closed)) {
              notes.set(closed, 'none, since the pull request closed.');
              updateOnly.add(closed);
            }

            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const outcome = {
              published: `https://pr-${target}.${PROJECT}.pages.dev/\n\n` +
                `Commit ${SHA}. Expires ${day(Date.now() + ttl)}. New commits replace it; ` +
                'on a pull request from a fork, they need the `preview` label again.',
              failed: `couldn't publish commit ${SHA}. See ${run}.`,
              // Unless it was approved and published since.
              unapproved: previews.get(target)?.some(d => commit(d) === SHA) ? undefined : waiting(SHA),
              unbuilt: `none, since commit ${SHA} didn't build. See the pull request's checks.`,
            }[STATE];
            if (outcome && target && !failed.has(target)) notes.set(target, outcome);

            const marker = '<!-- pr-preview -->';
            for (const [pr, note] of notes) {
              try {
                const body = `${marker}\n**Preview:** ${note}`;
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
                const mine = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
                if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                else if (!updateOnly.has(pr)) await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              } catch (e) {
                errors.push(`Comment on #${pr}: ${e.message}`);
              }
            }
            if (errors.length) core.setFailed(errors.join('\n'));
