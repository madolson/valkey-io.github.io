name: Build the website
description: >
  Builds a checkout of this repository into <path>/public, with its topics and
  commands from valkey-doc and the command metadata from valkey and the modules, checked out
  next to it in the workspace.

inputs:
  path:
    description: The website checkout to build, relative to the workspace (e.g. website).
    required: true
  checkout-content:
    description: Check out the content repositories. Set to false if an earlier build in the job already did.
    default: 'true'
  base-url:
    description: Build for this URL instead of config.toml's base_url (e.g. for a preview).
    default: ''
  preview-pr:
    description: Build a preview of this pull request, with a banner, noindex, and no analytics. Empty for production.
    default: ''
  preview-commit:
    description: The commit a preview shows, for its banner.
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout valkey
      if: inputs.checkout-content == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: valkey-io/valkey
        path: valkey

    - name: Checkout valkey-bloom
      if: inputs.checkout-content == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: valkey-io/valkey-bloom
        path: valkey-bloom

    - name: Checkout valkey-doc
      if: inputs.checkout-content == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: valkey-io/valkey-doc
        path: valkey-doc

    - name: Checkout valkey-json
      if: inputs.checkout-content == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: valkey-io/valkey-json
        path: valkey-json

    - name: Checkout valkey-search
      if: inputs.checkout-content == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: valkey-io/valkey-search
        path: valkey-search

    - name: Init commands and topics
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        ./build/init-topics.sh ../valkey-doc/topics
        ./build/init-commands.sh ../valkey-doc/commands \
          ../valkey/src/commands ../valkey-bloom/src/commands \
          ../valkey-json/src/commands ../valkey-search/src/commands

    - name: Build only
      uses: shalzz/zola-deploy-action@1be083648a1db2853ce4970e381740c0e2fd06de # v0.23.6
      env:
        BUILD_DIR: ${{ inputs.path }}
        BUILD_ONLY: true
        BUILD_THEMES: false
        BUILD_FLAGS: ${{ inputs.base-url && format('--base-url {0}', inputs.base-url) || '' }}
        # Read by the templates with get_env().
        VALKEY_PREVIEW_PR: ${{ inputs.preview-pr }}
        VALKEY_PREVIEW_COMMIT: ${{ inputs.preview-commit }}
