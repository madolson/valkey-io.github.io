{%- set pr = get_env(name="VALKEY_PREVIEW_PR") -%}
{%- set commit = get_env(name="VALKEY_PREVIEW_COMMIT", default="") -%}
<div id="pr-preview-banner" style="background:#fff4ce;color:#3b2f00;border-bottom:1px solid #e0b100;padding:8px 16px;font:15px/1.4 sans-serif;text-align:center">
  Preview of <a href="https://github.com/valkey-io/valkey-io.github.io/pull/{{ pr }}">pull request #{{ pr }}</a>
  {%- if commit %} at commit <code>{{ commit | truncate(length=10, end="") }}</code>{% endif %}.
  This is not the real site: <a href="https://valkey.io/">go to valkey.io</a>.
</div>
