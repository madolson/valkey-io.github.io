{#
  Line icons for the Why Valkey page, drawn in currentColor on a 24px grid.
  Usage: {{< wv_icon name="license" />}}
#}
{% component wv_icon(name, size=24) %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "foundation" -%}
  <path d="M3 21h18M5 21V10M19 21V10M9.67 21V10M14.33 21V10M2 10l10-6 10 6z"/>
{%- elif name == "license" -%}
  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 15l2 2 4-4"/>
{%- elif name == "balance" -%}
  <path d="M12 3v18M8 21h8M4 7h16M4 7l-3 6.5a3 3 0 0 0 6 0zM20 7l-3 6.5a3 3 0 0 0 6 0z"/>
{%- elif name == "signature" -%}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == "vote" -%}
  <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "cloud" -%}
  <path d="M7 18a5 5 0 0 1-.6-9.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>
{%- elif name == "bolt" -%}
  <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
{%- elif name == "check" -%}
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- endif -%}
</svg>
{% endcomponent wv_icon %}
