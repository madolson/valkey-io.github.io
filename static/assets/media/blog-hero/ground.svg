<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Valkey blog card background</title>
  <desc>The sky gradient, vignette and film grain every Valkey banner sits on.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0" stop-color="#060A24"/>
      <stop offset="0.48" stop-color="#171043"/>
      <stop offset="1" stop-color="#301868"/>
    </linearGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="960" cy="540" r="1180">
      <stop offset="0.5" stop-color="#03040F" stop-opacity="0"/>
      <stop offset="1" stop-color="#03040F" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="scrim">
      <stop offset="0" stop-color="#060A24" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#060A24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#060A24" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="h-cyan"><stop offset="0" stop-color="#46BDE9" stop-opacity="0.75"/><stop offset="0.4" stop-color="#46BDE9" stop-opacity="0.22"/><stop offset="1" stop-color="#46BDE9" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-ice"><stop offset="0" stop-color="#CCF1FF" stop-opacity="0.75"/><stop offset="0.4" stop-color="#CCF1FF" stop-opacity="0.22"/><stop offset="1" stop-color="#CCF1FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-mint"><stop offset="0" stop-color="#2CD5C4" stop-opacity="0.75"/><stop offset="0.4" stop-color="#2CD5C4" stop-opacity="0.22"/><stop offset="1" stop-color="#2CD5C4" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-coral"><stop offset="0" stop-color="#F65275" stop-opacity="0.75"/><stop offset="0.4" stop-color="#F65275" stop-opacity="0.22"/><stop offset="1" stop-color="#F65275" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-violet"><stop offset="0" stop-color="#963CBD" stop-opacity="0.75"/><stop offset="0.4" stop-color="#963CBD" stop-opacity="0.22"/><stop offset="1" stop-color="#963CBD" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-gold"><stop offset="0" stop-color="#FFB81C" stop-opacity="0.75"/><stop offset="0.4" stop-color="#FFB81C" stop-opacity="0.22"/><stop offset="1" stop-color="#FFB81C" stop-opacity="0"/></radialGradient>
    <filter id="blur3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur18" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur40" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
<!-- The shared ground of every Valkey banner.
     Generated by build/blog-hero/extract.mjs from valkey-svgs f5f0e8d77ca13c1b60ff5ab5142f5302cbb265bb
     (https://github.com/madolson/valkey-svgs). Copyright 2026 The valkey-svgs authors.
     Licensed under the Apache License, Version 2.0: see LICENSE and NOTICE in this directory.
     The Valkey name and mark are trademarks of the Linux Foundation and are not covered by it. -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>

</svg>
